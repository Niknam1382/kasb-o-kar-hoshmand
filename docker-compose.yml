# P29 (انتقالِ پوشه): نامِ پروژهٔ داکر به‌طورِ پیش‌فرض از **نامِ پوشه** ساخته می‌شود و حجمِ
# دیتابیس `kasb-o-kar-hoshmand_postgres_data` به همان نام است. با قفل‌کردنِ `name`، اگر
# پوشه را جابه‌جا یا نامش را عوض کنی، باز همان حجمِ دیتابیس قبلی استفاده می‌شود — وگرنه
# داکر یکِ دیتابیسِ خالیِ تازه می‌سازد و همه‌چیز «پاک شده» به‌نظر می‌آید.
# برایِ یکِ محیطِ موازیِ جدا (مثلاً دومین کپیِ پروژه رویِ همان ماشین):
#   docker compose -p kasbokar-dev up -d
name: kasb-o-kar-hoshmand

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      # د(ج): رمز از متغیرِ محیطی/.env خوانده می‌شود؛ پیش‌فرضِ `postgres` فقط برایِ توسعه‌یِ محلی است
      # و با استقرارِ فعلی سازگار می‌ماند. روی سرورِ واقعی حتماً POSTGRES_PASSWORD و DATABASE_URL را عوض کن.
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-kasbokar}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # P21-B (O5): پیش‌فرض‌هایِ کانتینر برایِ یکِ سرورِ کوچک ساختاریافته‌اند (shared_buffers=128MB)
    # و با سرورِ پیشنهادیِ مستندات (2GB) فاصله دارند؛ اینجا دست‌کم dev و prod عددِ نزدیک
    # می‌دهند. `jit=off` برایِ کوئری‌هایِ کوتاهِ OLTP (هزینهٔ کامپایلِ LLVM بیش از سودش است) و
    # `wal_compression=on` حجمِ وال را کم می‌کند. مقادیرِ بزرگ‌تر رویِ سرورِ واقعی:
    # shared_buffers=2GB / effective_cache_size=6GB ⇒ PRODUCTION_DEPLOYMENT_GUIDE.md §ظرفیت.
    command:
      - postgres
      - -c
      - shared_buffers=512MB
      - -c
      - effective_cache_size=2GB
      - -c
      - wal_compression=on
      - -c
      - jit=off
      # P25-F (دو پیچِ کم‌ریسکِ دیپلوی‌محور):
      # `log_min_duration_statement` ⇒ کوئریِ کندتر از ۲۵۰ms در لاگِ db نوشته می‌شود؛ بدونِ این،
      # کندیِ مسیرِ پرداخت رویِ سرورِ واقعی فقط «ربات کند است» به‌نظر می‌رسید و شاهدی نداشت.
      # `random_page_cost=1.1` ⇒ پیش‌فرضِ PG (۴٫۰) برایِ HDD است و رویِ NVMe پلنر را به سمتِ
      # sequential-scan می‌برد؛ با ۱٫۱ ایندکس‌هایِ مسیرِ پرداخت (مثلاً `ix_payments_bale_invoice_payload`)
      # واقعاً استفاده می‌شوند. هیچ‌کدام داده را دست نمی‌زنند؛ فقط ری‌استارتِ db لازم دارد.
      - -c
      - log_min_duration_statement=250ms
      - -c
      - random_page_cost=1.1
    ports:
      - "127.0.0.1:5432:5432"  # فقط لوکال؛ هرگز روی اینترنت باز نشه (رمزِ پیش‌فرض postgres است)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging: &log_rotation  # W5: چرخشِ لاگ تا دیسک پر نشه (۵ فایل × ۱۰ مگابایت)
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  bot:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    logging: *log_rotation
    # P24 (دیپلوی): سلامتِ اپ هر ۳۰ ثانیه پرسیده می‌شود. بی‌این، گیرکردنِ حلقهٔ polling (مثلاً
    # استخرِ DB تشنه) هیچ‌وقت خودکار ری‌استارت نمی‌شد و ربات «سالمِ مرده» بالا می‌ماند.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      # P29: `/health` تا پایانِ بارگذاریِ ربات‌ها جواب نمی‌دهد (عمداً — یعنی «هنوز آماده نیست»)،
      # پس این مهلت باید از زمانِ واقعیِ بوت بزرگ‌تر باشد. با ~۵۰۰ فروشگاه در اولین بوت (پاسِ
      # بیوگرافی ترتیبی است؛ REMAINING_ISSUES §P29-۷) این را ۹۰s یا بیشتر کن.
      start_period: ${BOT_HEALTH_START_PERIOD:-40s}
    # MEASURED: این سرویس در حالتِ بی‌کاری ۲۰۸ مگابایت رم می‌گیرد (`docker stats`؛ سوئیچِ
    # containerd/sharing ممکن است عدد را کمی جابه‌جا کند). سقفِ ۱ گیگ ≈ ۵ برابرِ سرِ‌باز است:
    # از پرشدنِ سرور جلوگیری می‌کند ولی خودِ اپ را OOM نمی‌کند. رویِ سرورِ واقعی با
    # HARDWARE_REQUIREMENTS_AND_CAPACITY_PLAN.md §۵ هماهنگش کن.
    # ⚠️ P29 (MEASURED با scripts/scale_probe.py): هر آبجکتِ `Bot` + sessionِ aiogram ≈ ۴۱۳ کیلوبایت
    # است ⇒ ۵۰۰ فروشگاه ≈ ۲۰۲ مگابایت *فقط برایِ اتصال‌ها*، رویِ ۲۱۷ مگابایتِ پایه. با ۵۰۰ سوکتِ
    # long-pollِ فعال و بافرِ TLS، سقفِ ۱ گیگ تنگ است: از ~۳۰۰ فروشگاه به بالا این را ۲ گیگ کن
    # (و سروری که برایِ آن لایه در playbook نوشته‌ای هم باید همین را داشته باشد).
    # به‌روز از پ۱۲۴ (MEASURED با همان اسکریپت، N=۲۰۰): ۵۱۹٫۷KiB به‌ازایِ هر آبجکتِ ربات ⇒ ۵۰۰ فروشگاه
    # ≈ ۲۵۴MiB فقط اتصال‌ها + ~۲۱۸MiB پایه ≈ ۴۷۲MiB؛ یعنی سقفِ ۱GiB برایِ ~۳۰۰ فروشگاه درست است و
    # از آن به بالا `BOT_MEM_LIMIT=2g` بگذار (همان چیزی که پایینِ همین بلوک توصیه می‌کند).
    # عمداً محدودیتِ CPU گذاشته نشده: اپ تک‌پروسه است و throttle کردنش یعنی افتادنِ پاسخِ پیام.
    mem_limit: ${BOT_MEM_LIMIT:-1g}
    # P29: خاموش‌شدنِ کرید‌شدهٔ ۵۰۰ ربات ≈ ۵۰۰/۲۴ × RTT (چند ثانیه) + بستنِ جاب‌ها؛ با مهلتِ ۱۰
    # ثانیهٔ پیش‌فرضِ داکر، هر دیپلوی در مقیاسِ بالا با SIGKILL تمام می‌شد (state نیمه‌تمام در تلگرام).
    stop_grace_period: 30s
    # P29: هر فروشگاهِ polling یکِ سوکتِ بازِ بلندمدت نگه می‌دارد ⇒ ۵۰۰ فروشگاه ≈ ۵۰۰ فایل‌دیسکریپتور
    # به‌علاوهٔ استخرِ دیتابیس و لاگ‌ها. سقفِ نرمِ ۱۰۲۴ِ بعضی میزبان‌ها «Too many open files» می‌دهد.
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    # ⚠️ هرگز این سرویس را اسکیل نکن («--scale bot=2»): دو نسخة polling هر دو getUpdates
    # می‌گیرند ⇒ پاسخِ دوباره به یکِ مشتری، کسرِ دوبارهٔ کیف‌پول از AI و ارسالِ تکراری.
    # گیتِ ضدِ تکرارِ نصب در app/main.py (قفلِ advisory دیتابیس) جلویِ دومینِ نمونه را می‌گیرد.
    volumes:
      # P44 · موردِ ۵۱: پوشهٔ مشترکِ بکاپ. فایل‌ها را سرویسِ `backup` پایینِ همین فایل می‌سازد و
      # اپ تازه‌ترین را به ادمین می‌فرستد و قدیمی‌ها را پاک می‌کند (BACKUP_DIR در .env).
      - backups:/backups

  # P44 · موردِ ۵۱: بکاپِ خودکارِ دیتابیس. با ایمیجِ خودِ postgres:16 (همین ایمیج رویِ سر دانلود
  # شده است) تا نسخهٔ pg_dump همیشه با سر یکی باشد. با `docker compose up -d` بالا می‌آید؛
  # اگر نمی‌خواهیش: `docker compose stop backup` و سوییچِ «ارسالِ خودکارِ بکاپ» را در پنل خاموش کن.
  backup:
    image: postgres:16
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # همان سه مقدارِ سرویسِ db؛ رمز فقط متغیرِ محیطی است و در هیچ فایلی نوشته نمی‌شود.
      PGHOST: db
      PGPORT: "5432"
      PGUSER: ${POSTGRES_USER:-postgres}
      PGPASSWORD: ${POSTGRES_PASSWORD:-postgres}
      PGDATABASE: ${POSTGRES_DB:-kasbokar}
      BACKUP_DIR: /backups
      BACKUP_AT_HOUR_UTC: ${BACKUP_AT_HOUR_UTC:-3}
      BACKUP_AT_MINUTE_UTC: ${BACKUP_AT_MINUTE_UTC:-5}
    volumes:
      - backups:/backups
      - ./scripts/backup_loop.sh:/scripts/backup_loop.sh:ro
    entrypoint: ["/bin/bash", "/scripts/backup_loop.sh"]
    mem_limit: ${BACKUP_MEM_LIMIT:-256m}
    logging: *log_rotation

volumes:
  postgres_data:
  # P44: فایل‌هایِ بکاپ (kasbokar-YYYYMMDD-HHMMSS.dump). با `docker volume rm` پاکشان نکن
  # مگر بعدِ برداشتنِ یکِ نسخهٔ جایِ دیگر؛ این حجم تنها کپیِ دیتابیسِ زنده رویِ همان سرور است.
  backups:

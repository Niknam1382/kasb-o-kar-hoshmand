services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      # د(ج): رمز از متغیرِ محیطی/.env خوانده می‌شود؛ پیش‌فرضِ `postgres` فقط برایِ توسعه‌یِ محلی است
      # و با استقرارِ فعلی سازگار می‌ماند. روی سرورِ واقعی حتماً POSTGRES_PASSWORD و DATABASE_URL را عوض کن.
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-kasbokar}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # P21-B (O5): پیش‌فرض‌هایِ کانتینر برایِ یکِ سرورِ کوچک ساختاریافته‌اند (shared_buffers=128MB)
    # و با سرورِ پیشنهادیِ مستندات (2GB) فاصله دارند؛ اینجا دست‌کم dev و prod عددِ نزدیک
    # می‌دهند. `jit=off` برایِ کوئری‌هایِ کوتاهِ OLTP (هزینهٔ کامپایلِ LLVM بیش از سودش است) و
    # `wal_compression=on` حجمِ وال را کم می‌کند. مقادیرِ بزرگ‌تر رویِ سرورِ واقعی:
    # shared_buffers=2GB / effective_cache_size=6GB ⇒ PRODUCTION_DEPLOYMENT_GUIDE.md §ظرفیت.
    command:
      - postgres
      - -c
      - shared_buffers=512MB
      - -c
      - effective_cache_size=2GB
      - -c
      - wal_compression=on
      - -c
      - jit=off
    ports:
      - "127.0.0.1:5432:5432"  # فقط لوکال؛ هرگز روی اینترنت باز نشه (رمزِ پیش‌فرض postgres است)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging: &log_rotation  # W5: چرخشِ لاگ تا دیسک پر نشه (۵ فایل × ۱۰ مگابایت)
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  bot:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    logging: *log_rotation

volumes:
  postgres_data:

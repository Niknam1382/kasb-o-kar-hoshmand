# این پروژه پکیجِ قابل‌نصب نیست (وابستگی‌ها از requirements.txt میان)، پس این
# فایل فقط پیکربندیِ ابزارهاست، نه [project]/[build-system].

[tool.ruff]
target-version = "py312"
line-length = 140

[tool.ruff.lint]
# عمداً یه ست ِمحافظه‌کارانه برایِ شروع: فقط خطاهایِ سبکیِ پایه (E) و
# مشکلاتِ واقعیِ pyflakes (F — importِ استفاده‌نشده، نامِ تعریف‌نشده، و
# مشابه). قوانینِ سخت‌گیرانه‌تر (isort، pyupgrade، bugbear و...) عمداً کنار
# گذاشته شدن چون بدونِ اجرایِ واقعیِ ruff روی کدِ فعلی (که توی sandboxِ من
# ممکن نبود — نه ruff نصب بود نه اینترنت) نمی‌شد مطمئن شد false-positiveِ
# زیاد نمی‌دن. بعداً که با `ruff check .` وضعِ فعلی رو دیدی، می‌شه هرچی خواستی
# اضافه/سفت‌تر کرد.
select = ["E", "F"]
